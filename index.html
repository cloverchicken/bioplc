<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLC Trọng điểm 1 – Năng lực giải thích hiện tượng Sinh học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f1f5f9; --ink:#0f172a; --ink2:#1e293b; --body:#1e293b; --muted:#475569; --faint:#64748b; --line:#e2e8f0;
  --pri:#4f46e5; --pri-h:#4338ca; --pri-d:#3730a3; --pri-50:#eef2ff; --pri-100:#e0e7ff; --pri-200:#c7d2fe; --pri-ink:#312e81;
  --ok:#059669; --ok-50:#ecfdf5; --ok-100:#d1fae5; --ok-200:#a7f3d0; --ok-ink:#065f46;
  --k1:#1d4ed8; --k1s:#eff6ff; --k2:#c2410c; --k2s:#fff7ed; --k3:#6d28d9; --k3s:#f5f3ff;
  --l0:#f8fafc; --l1:#ecfdf5; --l2:#d1fae5; --l3:#059669; --l3ink:#ffffff;
  --warn:#92400e; --warn-bg:#fffbeb; --warn-line:#fde68a;
  --sticky:rgba(255,255,255,.96); --shadow:0 1px 2px 0 rgba(15,23,42,.05); --shadow2:0 1px 3px 0 rgba(15,23,42,.1),0 1px 2px -1px rgba(15,23,42,.1);
  --sans:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --serif:var(--sans);
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
img{max-width:100%}
a{color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
.ico{width:1em;height:1em;flex:none;fill:currentColor}

/* ---------- Khung trang (theo mẫu: max-w-4xl, header dính) ---------- */
.shell{max-width:none;margin:0;padding:16px 12px}
@media (min-width:640px){.shell{padding:24px 24px}}
@media (min-width:1024px){.shell{padding:24px 40px}}
.sticky{position:sticky;top:0;z-index:40;background:var(--sticky);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);box-shadow:var(--shadow);margin:0 -12px 16px;padding:calc(4px + env(safe-area-inset-top,0px)) 12px 12px}
@media (min-width:640px){.sticky{margin:0 -24px 16px;padding-left:24px;padding-right:24px}}
@media (min-width:1024px){.sticky{margin:0 -40px 20px;padding-left:40px;padding-right:40px}}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand{margin:0;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--pri)}
.top h1{margin:0;font-size:1.125rem;line-height:1.35;font-weight:800;color:var(--ink)}
@media (min-width:640px){.top h1{font-size:1.25rem}}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:.75rem;font-weight:700;border-radius:8px;border:2px solid var(--pri-200);background:var(--pri-50);color:var(--pri-d);text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s}
@media (max-width:640px){.hbtn,.count{padding:5px 8px;font-size:.7rem;gap:4px}.top-r{gap:4px}}
.hbtn:hover{background:var(--pri-100);border-color:var(--pri)}
.count{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:.75rem;font-weight:700;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.langseg{display:inline-flex;border:2px solid var(--pri-200);border-radius:8px;overflow:hidden}
.langseg button{appearance:none;border:0;background:var(--surface);font:inherit;font-size:.75rem;font-weight:700;padding:6px 10px;color:var(--muted);cursor:pointer}
.langseg button.on{background:var(--pri);color:#fff}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:8px}
.progress div{height:100%;background:var(--pri);border-radius:999px;transition:width .4s ease}
.pills{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pill{flex:none;appearance:none;border:0;font:inherit;font-size:.75rem;font-weight:600;padding:6px 12px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background-color .15s,color .15s;background:var(--ok-100);color:var(--ok-ink)}
.pill:hover{background:var(--ok-200)}
.pill[aria-selected="true"]{background:var(--pri);color:#fff;box-shadow:var(--shadow2)}
.pill[disabled]{background:var(--surface2);color:var(--faint);cursor:not-allowed}
.pill .lock{width:10px;height:10px;opacity:.6}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:none;padding:20px;margin-bottom:16px}
@media (min-width:640px){.card{padding:32px}}
.foot{text-align:center;font-size:.75rem;color:var(--faint);padding-top:8px;border-top:1px solid var(--line)}
.fade-in{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade-in,.sub.on{animation:none}}

/* ---------- Đầu mỗi buổi ---------- */
.s-head{margin-bottom:16px}
.s-head .meta{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.s-head h2{display:flex;align-items:center;gap:10px;margin:0;font-size:1.25rem;line-height:1.35;font-weight:700;color:var(--pri-d)}
.goal{background:var(--pri-50);border:1px solid var(--pri-100);border-radius:12px;padding:16px;margin:0 0 20px;font-size:.875rem;color:var(--pri-ink);max-width:none}
.goal b{color:var(--pri-d)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin-bottom:20px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{flex:none;appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--body);font:inherit;font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
.tabs button:hover{border-color:var(--pri-200);color:var(--pri)}
.tabs button[aria-selected="true"]{background:var(--pri-50);border-color:var(--pri-200);color:var(--pri-d)}
.sub{display:none}
.sub.on{display:block;animation:fadeIn .35s ease}

h3{font-size:1.05rem;font-weight:700;color:var(--ink2);margin:18px 0 8px}
.sub>h3:first-child,.sub>.ex:first-child h4,.sub>p:first-child{margin-top:0}
h4{font-size:.95rem;font-weight:700;color:var(--ink2);margin:12px 0 5px}
p{margin:0 0 10px;color:var(--body);font-size:.9rem}
.note{color:var(--muted);font-size:.85rem}
ul,ol{padding-left:1.25em;margin:0 0 10px;color:var(--body);font-size:.9rem}
li{margin:3px 0}

/* bảng */
.tbl{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem;color:var(--body);line-height:1.42}
th,td{padding:5px 8px;vertical-align:top;text-align:left;border:1px solid var(--line)}
table td ul,table td ol{margin-bottom:0;padding-left:1.1em}
table td li{margin:1px 0}
table td p{margin:0 0 4px} table td p:last-child{margin-bottom:0}
table.fix1 th:first-child,table.fix1 td:first-child{position:sticky;left:0;z-index:2;box-shadow:2px 0 0 var(--line)}
table.fix1 td:first-child{background:var(--surface)}
table.fix1 thead th:first-child{background:var(--surface2)}
table.skb{table-layout:fixed}
table.tt th:first-child,table.tt td:first-child{width:20%}
table.fix2 th:first-child,table.fix2 td:first-child{position:sticky;left:0;width:64px;min-width:64px;max-width:64px;z-index:2}
table.fix2 th:nth-child(2),table.fix2 td:nth-child(2){position:sticky;left:64px;z-index:2;box-shadow:2px 0 0 var(--line)}
table.fix2 td:first-child,table.fix2 td:nth-child(2){background:var(--surface)}
table.fix2 thead th:first-child,table.fix2 thead th:nth-child(2),table.fix2 tr.total td:first-child,table.fix2 tr.total td:nth-child(2){background:var(--surface2)}
tr>:first-child{border-left:0} tr>:last-child{border-right:0}
thead tr:first-child>*{border-top:0} tbody tr:last-child>*{border-bottom:0}
th{background:var(--surface2);font-weight:700;color:var(--ink2)}
tbody th{background:color-mix(in srgb,var(--surface2) 50%,var(--surface));font-weight:600;white-space:nowrap}
table.fit{width:100%}
table.fit th,table.fit td{white-space:nowrap}
.tm-block{margin-bottom:4px}
.tm-block h4{margin-top:4px}
table.tm-tbl td{font-size:.83rem}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;background:var(--surface2);color:var(--ink2)}

/* màu kỹ năng */
.kn{display:inline-block;font-weight:700;font-size:.78em;padding:1px 7px;border-radius:6px;white-space:nowrap}
.kn.k1{color:var(--k1);background:var(--k1s)}
.kn.k2{color:var(--k2);background:var(--k2s)}
.kn.k3{color:var(--k3);background:var(--k3s)}
.skill{border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:16px}
.skill[data-k="1"]{--kc:var(--k1)} .skill[data-k="2"]{--kc:var(--k2)} .skill[data-k="3"]{--kc:var(--k3)}
.skill h3{margin-top:0;color:var(--kc)}
.skill dl{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;margin:0;font-size:.9rem}
.skill dt{font-weight:600;color:var(--muted);font-size:.85rem}
.skill dd{margin:0;color:var(--body)}
.skill dd ul{margin:4px 0 0}
@media (max-width:640px){.skill dl{grid-template-columns:1fr;gap:2px}.skill dd{margin-bottom:10px}}

/* thang 4 mức */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.legend span{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--body)}
.ind{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.ind header{padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-bottom:1px solid var(--line)}
.ind header h4{margin:0;font-size:.95rem}
.ind header .forms{font-size:.8rem;color:var(--muted);flex-basis:100%}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;padding:0;margin:0}
.ladder li{padding:8px 10px;margin:0;font-size:.85rem;color:var(--body);border-right:1px solid var(--line)}
.ladder li:last-child{border-right:0}
.ladder li b{display:block;font-size:.75rem;margin-bottom:2px;color:var(--ink2)}
.ladder li[data-l="0"]{background:var(--l0)}
.ladder li[data-l="1"]{background:var(--l1)}
.ladder li[data-l="2"]{background:var(--l2)}
.ladder li[data-l="3"]{background:var(--l3);color:var(--l3ink)}
.ladder li[data-l="3"] b{color:var(--l3ink)}
@media (max-width:760px){.ladder{grid-template-columns:1fr}.ladder li{border-right:0;border-bottom:1px solid var(--line)}.ladder li:last-child{border-bottom:0}}

/* ví dụ bài làm */
.ex{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:12px 16px;margin-bottom:12px}
.ex .q{font-style:italic;margin-bottom:8px}
.ex .row{display:grid;grid-template-columns:40px 1fr 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.875rem;color:var(--body)}
.ex .lv{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--pri-50);color:var(--pri)}
.ex .why{color:var(--muted);font-size:.85rem}
@media (max-width:640px){.ex .row{grid-template-columns:36px 1fr}.ex .why{grid-column:2}}

/* trọng số */
.bar{display:flex;height:36px;border-radius:999px;overflow:hidden;margin:6px 0 8px}
.bar div{display:flex;align-items:center;padding:0 12px;font-size:.8rem;font-weight:700;color:#fff;white-space:nowrap}

/* mô hình nhiệm vụ */
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px}
.tm{border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:16px}
.tm[data-k="1"]{--kc:var(--k1)} .tm[data-k="2"]{--kc:var(--k2)} .tm[data-k="3"]{--kc:var(--k3)}
.tm h4{margin:0 0 10px;font-size:.92rem;line-height:1.45}
.tm dl{display:grid;grid-template-columns:1fr;gap:0;margin:0;font-size:.85rem}
.tm dt{color:var(--muted);font-size:.75rem;font-weight:600;margin-top:8px}
.tm dd{margin:0;color:var(--body)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:0 4px 4px 0;font-size:.8rem;background:var(--surface2)}
.gen{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;background:var(--pri-50);border:1px solid var(--pri-100);border-radius:12px;padding:10px 12px;margin:0 0 14px;font-size:.875rem}
.gen dt{font-weight:700;color:var(--pri-d)}
.gen dd{margin:0;color:var(--pri-ink)}
@media (max-width:640px){.gen{grid-template-columns:1fr;gap:2px}.gen dd{margin-bottom:8px}}
.toolbar{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.toolbar button{appearance:none;font:inherit;font-size:.75rem;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--body);padding:5px 12px;border-radius:8px;cursor:pointer}
.toolbar button:hover{border-color:var(--pri-200);color:var(--pri)}
.toolbar .export{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--ok-100);border-color:var(--ok-200);color:var(--ok-ink)}
.toolbar .export:hover{border-color:var(--ok);color:var(--ok-ink)}
.toolbar .xmsg{font-size:.75rem;color:var(--muted);align-self:center}
.toolbar button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.notebox{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:.875rem;color:var(--warn)}
.lock{width:12px;height:12px;vertical-align:-1px;margin-right:3px}

/* mục lục */
.toc-phase{margin:0 0 24px}
.toc-phase>h3{margin:0 0 10px;font-size:1rem;color:var(--ink2)}
.toc-phase>h3 span{font-weight:500;font-size:.85rem;color:var(--muted)}
.toc-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.toc-list li{margin:0}
.toc-item{display:grid;grid-template-columns:40px 84px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin:0;color:inherit;font:inherit;text-align:left;width:100%}
button.toc-item{cursor:pointer;appearance:none;transition:border-color .15s}
button.toc-item:hover{border-color:var(--pri-200)}
.toc-item .n{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--pri-50);color:var(--pri)}
.toc-item.locked .n{background:var(--surface2);color:var(--faint)}
.toc-item .w{font-weight:700;font-size:.85rem;color:var(--pri);padding-top:7px;white-space:nowrap}
.toc-item.locked .w{color:var(--faint)}
.toc-item .c b{display:block;font-size:.95rem;font-weight:700;color:var(--ink2);margin-bottom:2px}
.toc-item.locked .c b{color:var(--muted)}
.toc-item .c p{margin:0;color:var(--muted);font-size:.85rem}
.toc-item .st{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;margin-top:5px;display:inline-flex;align-items:center;gap:4px}
.toc-item .st.open{background:var(--ok-100);color:var(--ok-ink)}
.toc-item .st.lk{background:var(--surface2);color:var(--faint)}
@media (max-width:640px){.toc-item{grid-template-columns:36px 1fr;gap:4px 12px}.toc-item .w{padding-top:8px}.toc-item .c{grid-column:1 / -1}.toc-item .st{grid-column:1 / -1;justify-self:start}}
@media print{.sticky .pills,.tabs,.toolbar{display:none}.sticky{position:static}.sub{display:block!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="shell">
  <div class="sticky">
    <header class="top">
      <div>
        <p class="brand">Bio PLC – Trọng điểm 1</p>
        <h1>Năng lực giải thích hiện tượng thực tiễn trong Sinh học</h1>
      </div>
      <div class="top-r">
        <a class="hbtn" href="https://forms.cloud.microsoft/r/4XFZW0jXWS" target="_blank" rel="noopener noreferrer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h11a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v16h11V4H6zm2 3h7v2H8zm0 4h7v2H8zm0 4h4v2H8z"/></svg>Nhật ký phản tư</a>
        <a class="hbtn" href="https://forms.cloud.microsoft/r/6wVjynnnQG" target="_blank" rel="noopener noreferrer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3zm0 4H6v14h12V6h-3v2H9zm1.3 9.6 5.3-5.3 1.4 1.4-6.7 6.7-3.7-3.7 1.4-1.4z"/></svg>Khảo sát năng lực đánh giá</a>
        <span class="count" id="count"></span>
        <span class="langseg" role="group" aria-label="Language / Ngôn ngữ"><button type="button" id="lang-vi">VN</button><button type="button" id="lang-en">EN</button></span>
      </div>
    </header>
    <div class="progress" aria-hidden="true"><div id="prog"></div></div>
    <nav class="pills" id="rail" role="tablist" aria-label="Các buổi PLC"></nav>
  </div>
  <main class="card fade-in" id="main"></main>
  <footer class="foot">LSTS - Bio PLC - AY26-27</footer>
</div>

<!-- ================= BUỔI 1 ================= -->
<template id="tpl-1">

<section class="sub" data-label="Định nghĩa năng lực">
  <h3>Định nghĩa</h3>
  <p><b>Năng lực giải thích hiện tượng thực tiễn trong Sinh học</b> là khả năng tổng hợp các loại kiến thức (nội dung, quy trình và nhận thức luận) cùng các kỹ năng tư duy để xây dựng, trình bày và đánh giá các giải thích nhất quán về mặt logic cho các sự vật, hiện tượng hoặc quá trình trong thế giới sống, sức khỏe, sản xuất hoặc môi trường.</p>
  <p>Mỗi kỹ năng có hai tầng định nghĩa: <b>định nghĩa</b> (kỹ năng là gì) và <b>chỉ báo hành vi</b> (HS phải làm được gì trên bài làm thì được coi là có kỹ năng) – tầng thứ hai dùng để viết câu hỏi và chấm điểm.</p>
  <h3>Chỉ báo hành vi của năng lực</h3>
  <p>Khi được cho một hiện tượng thực tiễn (kèm mô tả, số liệu hoặc hình), HS được coi là thể hiện năng lực nếu:</p>
  <ul>
    <li>(a) chọn và áp dụng đúng khái niệm, quy luật sinh học liên quan <span class="kn k1">KN1</span></li>
    <li>(b) dùng dữ liệu, quan sát để ủng hộ hoặc bác bỏ một nhận định và nêu được chuỗi nhân quả giải thích hiện tượng <span class="kn k2">KN2</span></li>
    <li>(c) đọc, chuyển đổi hoặc xây dựng biểu đạt (sơ đồ, bảng, đồ thị, mô hình) để trình bày và hỗ trợ lời giải thích <span class="kn k3">KN3</span></li>
  </ul>
  <p>Mức năng lực được ước lượng từ tổng hợp kết quả ba kỹ năng, và báo cáo riêng từng kỹ năng để chẩn đoán.</p>
  <h3>Các thuật ngữ chính</h3>
  <div class="tbl"><table>
    <thead><tr><th>Thuật ngữ</th><th>Nghĩa dùng trong công cụ</th><th>Ví dụ: KHTN Sinh 9</th></tr></thead>
    <tbody>
      <tr><td><b>Hiện tượng thực tiễn</b></td><td>Sự việc sinh học quan sát được trong đời sống, sức khỏe, nông nghiệp, an toàn sinh học hoặc môi trường, đặt ra câu hỏi "vì sao" hoặc "bằng cách nào"</td><td>Bố mẹ da bình thường sinh con bạch tạng</td></tr>
      <tr><td><b>Mô tả</b></td><td>Nêu lại cái gì xảy ra; không đủ để được tính là giải thích</td><td>"Con bị bạch tạng dù bố mẹ bình thường"</td></tr>
      <tr><td><b>Giải thích</b></td><td>Nêu vì sao, bằng cách nào hiện tượng xảy ra, dựa trên kiến thức khoa học và có cơ chế</td><td>"Bố mẹ đều mang gene lặn gây bệnh (Aa), con nhận hai gene lặn (aa) nên biểu hiện bệnh"</td></tr>
      <tr><td><b>Bằng chứng</b></td><td>Số liệu, quan sát, kết quả thí nghiệm được dùng để ủng hộ hoặc bác bỏ một nhận định</td><td>Bảng tỉ lệ vi khuẩn sống sót qua các đợt dùng kháng sinh</td></tr>
      <tr><td><b>Chuỗi nhân quả (cơ chế)</b></td><td>Chuỗi các bước nối nguyên nhân với kết quả, mỗi bước có thực thể và hoạt động cụ thể</td><td>Gene đột biến → mARN → amino acid thay đổi → hemoglobin → hồng cầu hình liềm</td></tr>
      <tr><td><b>Biểu đạt</b></td><td>Cách trình bày thông tin: chữ, hình, sơ đồ, bảng, đồ thị, sơ đồ lai, phả hệ, tỉ lệ, công thức</td><td>Sơ đồ phả hệ 3 thế hệ; sơ đồ lai P → F1 → F2</td></tr>
    </tbody></table></div>
</section>

<section class="sub" data-label="3 kỹ năng thành phần">

<section class="sub" data-label="Ranh giới và phạm vi">
  <h3>Ranh giới giữa ba kỹ năng</h3>
  <p>Bài làm thật thường thể hiện nhiều kỹ năng cùng lúc. Để chấm nhất quán, tổ dùng <b>quy tắc phân loại theo chỗ HS thất bại</b>:</p>
  <ul>
    <li>HS sai vì <b>không biết hoặc chọn sai khái niệm</b> → thiếu <span class="kn k1">KN1</span></li>
    <li>HS biết khái niệm, đọc đúng dữ liệu nhưng <b>không nối được dữ liệu với kết luận</b> hoặc <b>đứt chuỗi nhân quả</b> → thiếu <span class="kn k2">KN2</span></li>
    <li>HS sai vì <b>không đọc, chuyển đổi hoặc tạo được biểu đạt</b> → thiếu <span class="kn k3">KN3</span></li>
  </ul>
  <h4>Ví dụ phân loại hành vi trong cùng một chùm câu hỏi bạch tạng</h4>
  <div class="tbl"><table>
    <thead><tr><th>Hành vi của HS trên bài làm</th><th>Kỹ năng</th><th>Lý do</th></tr></thead>
    <tbody>
      <tr><td>Nêu "bạch tạng do gene lặn quy định"</td><td><span class="kn k1">KN1</span></td><td>Gọi đúng khái niệm, quy luật</td></tr>
      <tr><td>Chỉ ra trên phả hệ: bố mẹ bình thường, con bị bệnh</td><td><span class="kn k3">KN3</span></td><td>Đọc thông tin từ biểu đạt</td></tr>
      <tr><td>Dùng dữ kiện đó để kết luận tính trạng là lặn</td><td><span class="kn k2">KN2</span></td><td>Dùng bằng chứng để đi đến nhận định</td></tr>
      <tr><td>Lập sơ đồ lai Aa × Aa → 1/4 aa</td><td><span class="kn k3">KN3</span></td><td>Chuyển phả hệ sang sơ đồ lai; dùng mô hình tỉ lệ</td></tr>
      <tr><td>Giải thích vì sao con nhận hai gene lặn dẫn đến không tổng hợp được sắc tố</td><td><span class="kn k2">KN2</span></td><td>Xây dựng chuỗi nhân quả, cơ chế</td></tr>
      <tr><td>Dự đoán xác suất đứa con tiếp theo bị bệnh</td><td><span class="kn k3">KN3</span></td><td>Dùng mô hình để dự đoán</td></tr>
    </tbody></table></div>

  <h3>Phạm vi nội dung và bối cảnh</h3>
  <div class="tbl"><table><tbody>
    <tr><th>Nội dung được đo</th><td>Phần Sinh học trong KHTN 9 (CT GDPT 2018), Bài 35–43: di truyền Mendel; DNA – gene – protein; nhiễm sắc thể; nguyên phân, giảm phân; NST giới tính và di truyền liên kết. Chỉ gồm nội dung HS đã học trước tuần 23. Bối cảnh sức khỏe có thể dùng bệnh di truyền ở người làm tình huống, nhưng không hỏi kiến thức thuộc Bài 44–48 (di truyền học người, ứng dụng công nghệ di truyền, tiến hóa).</td></tr>
    <tr><th>Kiến thức nền</th><td>Kiến thức KHTN 8 (cơ thể người, sinh thái) chỉ dùng làm bối cảnh, không hỏi trực tiếp.</td></tr>
    <tr><th>Loại bối cảnh</th><td>Sức khỏe (bệnh di truyền, kháng kháng sinh); nông nghiệp (giống cây trồng, vật nuôi, chọn giống); an toàn sinh học (sinh vật biến đổi gen); đời sống (đặc điểm di truyền trong gia đình).</td></tr>
    <tr><th>Loại trừ</th><td>Bối cảnh nhạy cảm với HS (xét nghiệm huyết thống, bệnh của người thật được nêu tên); nội dung chuyên đề THPT; đánh giá tác động xã hội – đạo đức của khoa học.</td></tr>
  </tbody></table></div>

  <h3>Mục đích sử dụng điểm</h3>
  <ul>
    <li><b>Được dùng cho:</b> đánh giá chẩn đoán và đánh giá quá trình ở cấp tổ/trường, để biết HS mạnh, yếu ở kỹ năng nào và điều chỉnh dạy học.</li>
    <li><b>Không dùng cho:</b> xếp loại HS, tính điểm học bạ, so sánh giữa các lớp hoặc giáo viên trong giai đoạn thử nghiệm.</li>
    <li><b>Đơn vị báo cáo:</b> điểm toàn bài và điểm riêng từng kỹ năng. Điểm từng kỹ năng chỉ nên diễn giải ở cấp nhóm, vì mỗi kỹ năng có ít câu nên độ tin cậy ở cấp cá nhân còn hạn chế.</li>
  </ul>
</section>

<section class="sub" data-label="Phương pháp và 4 mức">
  <h3>Mục đích và cách dùng</h3>
  <p>Khung chỉ báo là <b>mô hình bằng chứng</b> của công cụ (Mislevy, Steinberg và Almond, 2003): nó nói rõ hành vi nào trên bài làm chứng tỏ HS có kỹ năng, và ở mức nào. Khung gồm <b>11 chỉ báo</b> cho 3 kỹ năng (<span class="kn k1">KN1</span> 3; <span class="kn k2">KN2</span> 4; <span class="kn k3">KN3</span> 4), mỗi chỉ báo mô tả ở 4 mức.</p>
  <ul>
    <li><b>Câu mở</b> (trả lời ngắn, tự luận giải thích): chấm trực tiếp theo 4 mức của chỉ báo mà câu đó đo. Rubric của từng câu là bản cụ thể hóa các mô tả mức cho nội dung của câu.</li>
    <li><b>Câu đóng</b> (trắc nghiệm, Đúng/Sai): mỗi câu được thiết kế để <b>nhắm vào một mức</b> của chỉ báo (mức 1, 2 hoặc 3). Mức của HS được suy ra từ tổ hợp các câu đã làm đúng. Khi viết ngân hàng câu hỏi v.1, mỗi câu ghi kèm mã dạng <i>KN2.2-M2</i> (chỉ báo – mức nhắm tới).</li>
  </ul>
  <h3>Ý nghĩa chung của 4 mức (thang SOLO)</h3>
  <div class="tbl"><table>
    <thead><tr><th>Mức</th><th>Tên</th><th>Tương ứng SOLO</th><th>Ý nghĩa chung cho mọi chỉ báo</th></tr></thead>
    <tbody>
      <tr><td><b>0</b></td><td>Chưa đạt</td><td>Tiền cấu trúc</td><td>Không trả lời, hoặc thông tin không liên quan, sai khoa học, chỉ lặp lại hiện tượng.</td></tr>
      <tr><td><b>1</b></td><td>Đạt một phần</td><td>Đơn cấu trúc / Đa cấu trúc</td><td>Có một hoặc vài yếu tố đúng nhưng rời rạc, thiếu liên kết hoặc thiếu bước.</td></tr>
      <tr><td><b>2</b></td><td>Đạt</td><td>Quan hệ</td><td>Các yếu tố đúng được nối thành một tổng thể mạch lạc; đáp ứng đầy đủ yêu cầu cần đạt của KHTN 9.</td></tr>
      <tr><td><b>3</b></td><td>Vượt</td><td>Trừu tượng mở rộng</td><td>Như mức 2, và khái quát sang tình huống mới, xét giới hạn của dữ liệu hoặc mô hình, hoặc xét lời giải thích thay thế.</td></tr>
    </tbody></table></div>
  <p><b>Mức 2 là mức chuẩn</b> – tương ứng với yêu cầu cần đạt của chương trình. Mức 3 mô tả HS vượt yêu cầu; việc giữ mức 3 cho HS lớp 9 là giả thuyết, được kiểm chứng qua tiến trình học tập.</p>

<section class="sub" data-label="Thẩm định khung &amp; rubric">
  <h3>Thẩm định chuyên gia cho chính khung và rubric</h3>
  <p>Bộ mô tả năng lực và rubric là <b>chuẩn đối chiếu</b> của mọi khâu sau: câu hỏi được chấm theo chỉ báo và mức nhắm, bài làm được chấm theo rubric. Nếu chuẩn tự nó có lỗi — chỉ báo chồng lấn, mức không tăng tiến, rubric không phân biệt được các mức — thì kết quả thẩm định câu hỏi vẫn có thể đẹp trên một nền sai, và về sau không phân biệt được lỗi nằm ở công cụ hay ở người chấm. Vì vậy khung được thẩm định <b>trước và tách riêng</b> thành một đợt, hoàn tất trước Buổi 5 để tổ chốt khung và align bộ câu hỏi; phiếu câu hỏi chỉ gửi sau đó.</p>
  <h3>Nguyên tắc thẩm định</h3>
  <ul>
    <li><b>Chuẩn trước, câu hỏi sau.</b> Khung phải được chốt xong mới thẩm định câu hỏi; câu hỏi luôn được đối chiếu với khung đã điều chỉnh, không với bản nháp.</li>
    <li><b>Độc lập và đa góc nhìn.</b> Cùng một hội đồng chuyên gia — đo lường, nội dung Sinh học, giáo viên thực hành, ngôn ngữ — thẩm định cả khung lẫn câu hỏi; mỗi người chấm độc lập trước khi họp thống nhất.</li>
    <li><b>Quyết định theo từng đơn vị nhỏ nhất.</b> Mỗi thành phần của khung được xem xét riêng, để tổ quyết định giữ / sửa / gộp–loại đúng vào thành phần đó, không kết luận chung chung cho cả khung.</li>
    <li><b>Thay đổi phải truy vết được.</b> Khung đổi ở đâu thì câu hỏi liên quan phải được rà và align tới đó; không để tồn tại câu hỏi được chấm theo khung cũ.</li>
    <li><b>Chuyên gia tư vấn, tổ quyết định.</b> Góp ý của chuyên gia là bằng chứng để tổ cân nhắc; quyết định cuối cùng và lý do thuộc về tổ.</li>
  </ul>
  <h3>Khung thiết kế phần thẩm định</h3>
  <p>Phần thẩm định đi theo đúng cấu trúc tầng của khung, từ tổng quát đến cụ thể — 23 đơn vị:</p>
  <div class="tbl"><table>
    <thead><tr><th>Tầng của khung</th><th>Số đơn vị</th></tr></thead>
    <tbody>
      <tr><td>Định nghĩa năng lực</td><td>1</td></tr>
      <tr><td>Định nghĩa 3 kỹ năng thành phần</td><td>3</td></tr>
      <tr><td>Chỉ báo hành vi (KN1.1–KN3.4)</td><td>11</td></tr>
      <tr><td>Bộ mô tả mức theo từng kỹ năng</td><td>3</td></tr>
      <tr><td>Rubric (rubric chung + rubric 4 câu tự luận)</td><td>5</td></tr>
    </tbody></table></div>
  <p>Mỗi đơn vị được chuyên gia xem xét theo ba khía cạnh: <b>đúng và đủ</b> (đúng bản chất, đủ phạm vi), <b>rõ ràng</b> (đọc hiểu như nhau, quan sát được) và <b>phân biệt</b> (không chồng lấn với đơn vị kề bên) — kèm một đề xuất giữ / sửa / gộp–loại và góp ý cụ thể. Cuối phiếu có phần góp ý bao phủ toàn khung: 3 kỹ năng và 11 chỉ báo đã phủ đủ năng lực chưa, chỗ nào còn thiếu hoặc thừa.</p>

<template id="tpl-1-en">

<section class="sub" data-label="Definition of the competency">
  <h3>Definition</h3>
  <p><b>The competency of explaining real-world phenomena in Biology</b> is the ability to synthesise different kinds of knowledge (content, procedural and epistemological) together with thinking skills to construct, present and evaluate logically coherent explanations of objects, phenomena or processes in the living world, health, production or the environment.</p>
  <p>Each skill has two definitional layers: a <b>definition</b> (what the skill is) and <b>behavioural indicators</b> (what a student must do in their work to be considered as having the skill) – the second layer is used to write items and score responses.</p>
  <h3>Behavioural indicators of the competency</h3>
  <p>Given a real-world phenomenon (with a description, data or a figure), a student is considered to demonstrate the competency if they:</p>
  <ul>
    <li>(a) select and correctly apply the relevant biological concepts and laws <span class="kn k1">KN1</span></li>
    <li>(b) use data and observations to support or refute a claim and state the causal chain explaining the phenomenon <span class="kn k2">KN2</span></li>
    <li>(c) read, transform or construct representations (diagrams, tables, graphs, models) to present and support the explanation <span class="kn k3">KN3</span></li>
  </ul>
  <p>The competency level is estimated from the combined results of the three skills, and each skill is also reported separately for diagnosis.</p>
  <h3>Key terms</h3>
  <div class="tbl"><table>
    <thead><tr><th>Term</th><th>Meaning as used in this instrument</th><th>Example: Grade 9 Science (Biology)</th></tr></thead>
    <tbody>
      <tr><td><b>Real-world phenomenon</b></td><td>An observable biological event in daily life, health, agriculture, biosafety or the environment that raises a "why" or "how" question</td><td>Parents with normal skin have an albino child</td></tr>
      <tr><td><b>Description</b></td><td>Restating what happens; not sufficient to count as an explanation</td><td>"The child has albinism although the parents are normal"</td></tr>
      <tr><td><b>Explanation</b></td><td>Stating why and how a phenomenon occurs, based on scientific knowledge and involving a mechanism</td><td>"Both parents carry the recessive disease gene (Aa); the child receives two recessive genes (aa) and therefore expresses the disease"</td></tr>
      <tr><td><b>Evidence</b></td><td>Data, observations or experimental results used to support or refute a claim</td><td>A table of bacterial survival rates across rounds of antibiotic use</td></tr>
      <tr><td><b>Causal chain (mechanism)</b></td><td>A chain of steps linking cause to effect, each step with a specific entity and activity</td><td>Mutant gene → mRNA → amino acid change → haemoglobin → sickle-shaped red blood cells</td></tr>
      <tr><td><b>Representation</b></td><td>A way of presenting information: text, figures, diagrams, tables, graphs, cross diagrams, pedigrees, ratios, formulas</td><td>A 3-generation pedigree; a cross diagram P → F1 → F2</td></tr>
    </tbody></table></div>
</section>

<section class="sub" data-label="The 3 component skills">
  <div class="tbl"><table class="fix1 skb"><colgroup><col style="width:13%"><col style="width:24%"><col style="width:24%"><col style="width:15%"><col style="width:16%"><col style="width:8%"></colgroup>
    <thead><tr><th>Skill</th><th>Definition</th><th>Behavioural indicators</th><th>Not part of this skill</th><th>Example in Grade 9 Science</th><th>Main cognitive levels</th></tr></thead>
    <tbody>
      <tr>
        <td><span class="kn k1">KN1</span><br><b>Knowledge retrieval</b></td>
        <td>The ability to recall and correctly select the biological concepts, laws and principles appropriate to the real-world context presented.</td>
        <td>Given a phenomenon, the student:<ul><li>Identifies the biological concepts and laws related to the phenomenon;</li><li>Distinguishes closely related concepts and recognises scientifically incorrect statements;</li><li>Applies concepts and laws to the correct object in the situation.</li></ul></td>
        <td>Stating definitions detached from context (rote recall, not included in the instrument); using data to argue (<span class="kn k2">KN2</span>); reading information from a figure (<span class="kn k3">KN3</span>).</td>
        <td>"Which law does the albinism trait follow?"; "Which of the following statements about antibiotic-resistant bacteria is incorrect?"</td>
        <td>Remember – Understand (partly Apply)</td></tr>
      <tr>
        <td><span class="kn k2">KN2</span><br><b>Using evidence to reason about cause–effect and relationships</b></td>
        <td>The ability to use scientific evidence (experimental data, observations) to support or refute a claim, and to build a logical causal chain that clarifies the mechanism of a phenomenon.</td>
        <td>Given a phenomenon with data, the student:<ul><li>States a claim answering the question;</li><li>Selects and cites appropriate evidence;</li><li>Links the evidence to the claim using a biological principle;</li><li>Builds a causal chain (mechanism).</li></ul></td>
        <td>Merely naming a law without linking it to the data (<span class="kn k1">KN1</span>); merely reading values correctly from a table without using them to draw a conclusion (<span class="kn k3">KN3</span> – reading representations).</td>
        <td>"Based on the table of bacterial survival rates, do you agree with the claim 'bacteria transform themselves to resist the drug'? Explain."</td>
        <td>Understand – Apply</td></tr>
      <tr>
        <td><span class="kn k3">KN3</span><br><b>Using models and multiple representations</b></td>
        <td>The ability to identify, construct and use forms of representation (text, diagrams, images, tables, graphs, mathematical models) as mediating tools to illustrate and explain biological processes.</td>
        <td>The student:<ul><li>Reads and extracts information from representations;</li><li>Converts between forms of representation;</li><li>Constructs diagrams and models presenting a process or mechanism;</li><li>Uses models (including mathematical ratios) to predict and explain.</li></ul></td>
        <td>Arguing why the data support a claim (<span class="kn k2">KN2</span>); knowing the name of a concept shown in a figure (<span class="kn k1">KN1</span>).</td>
        <td>"From the pedigree, construct the cross diagram for the couple in generation II"; "Draw a diagram from gene to red blood cell shape".</td>
        <td>Understand – Apply</td></tr>
    </tbody></table></div>
</section>

<section class="sub" data-label="Boundaries and scope">
  <h3>Boundaries between the three skills</h3>
  <p>Real student work usually shows several skills at once. For consistent scoring, the team uses the <b>classification rule based on where the student fails</b>:</p>
  <ul>
    <li>The student fails because they <b>do not know, or choose the wrong, concept</b> → lacking <span class="kn k1">KN1</span></li>
    <li>The student knows the concept and reads the data correctly but <b>cannot link the data to the conclusion</b> or the <b>causal chain breaks</b> → lacking <span class="kn k2">KN2</span></li>
    <li>The student fails because they <b>cannot read, convert or create a representation</b> → lacking <span class="kn k3">KN3</span></li>
  </ul>
  <h4>Example: classifying behaviours within one albinism item cluster</h4>
  <div class="tbl"><table>
    <thead><tr><th>Student behaviour in the work</th><th>Skill</th><th>Reason</th></tr></thead>
    <tbody>
      <tr><td>States "albinism is determined by a recessive gene"</td><td><span class="kn k1">KN1</span></td><td>Names the correct concept/law</td></tr>
      <tr><td>Points out on the pedigree: parents normal, child affected</td><td><span class="kn k3">KN3</span></td><td>Reads information from a representation</td></tr>
      <tr><td>Uses that fact to conclude the trait is recessive</td><td><span class="kn k2">KN2</span></td><td>Uses evidence to reach a claim</td></tr>
      <tr><td>Sets up the cross Aa × Aa → 1/4 aa</td><td><span class="kn k3">KN3</span></td><td>Converts a pedigree into a cross diagram; uses a ratio model</td></tr>
      <tr><td>Explains why receiving two recessive genes leads to no pigment synthesis</td><td><span class="kn k2">KN2</span></td><td>Builds a causal chain (mechanism)</td></tr>
      <tr><td>Predicts the probability that the next child is affected</td><td><span class="kn k3">KN3</span></td><td>Uses a model to predict</td></tr>
    </tbody></table></div>

  <h3>Content and context scope</h3>
  <div class="tbl"><table><tbody>
    <tr><th>Content assessed</th><td>The Biology part of Grade 9 Science (2018 General Education Curriculum), Lessons 35–43: Mendel's laws of inheritance; DNA – gene – protein; chromosomes; mitosis, meiosis; sex chromosomes and linkage. Only content students have learned before Week 23. Health contexts may use human genetic diseases as situations, but knowledge from Lessons 44–48 (human genetics, applications of genetic technology, evolution) is not assessed.</td></tr>
    <tr><th>Background knowledge</th><td>Grade 8 Science knowledge (the human body, ecology) is used only as context, not asked directly.</td></tr>
    <tr><th>Context types</th><td>Health (genetic diseases, antibiotic resistance); agriculture (crop varieties, livestock, selective breeding); biosafety (genetically modified organisms); daily life (inherited characteristics in families).</td></tr>
    <tr><th>Exclusions</th><td>Contexts sensitive for students (paternity testing, named real patients); high-school specialised content; evaluating the social–ethical impacts of science.</td></tr>
  </tbody></table></div>

  <h3>Intended uses of scores</h3>
  <ul>
    <li><b>Used for:</b> diagnostic and formative assessment at department/school level, to identify which skill students are strong or weak in and adjust teaching.</li>
    <li><b>Not used for:</b> grading students, report-book scores, or comparing classes or teachers during the pilot phase.</li>
    <li><b>Reporting unit:</b> whole-test score and separate scores per skill. Per-skill scores should only be interpreted at group level, because each skill has few items, so reliability at the individual level is limited.</li>
  </ul>
</section>

<section class="sub" data-label="Method and the 4 levels">
  <h3>Purpose and use</h3>
  <p>The indicator framework is the <b>evidence model</b> of the instrument (Mislevy, Steinberg &amp; Almond, 2003): it states clearly which behaviours in student work show that a student has a skill, and at what level. The framework has <b>11 indicators</b> for 3 skills (<span class="kn k1">KN1</span> 3; <span class="kn k2">KN2</span> 4; <span class="kn k3">KN3</span> 4), each described at 4 levels.</p>
  <ul>
    <li><b>Open items</b> (short answer, explanatory essay): scored directly against the 4 levels of the indicator the item measures. Each item's rubric is the concretisation of the level descriptions for that item's content.</li>
    <li><b>Closed items</b> (multiple choice, True/False): each item is designed to <b>target one level</b> of an indicator (Level 1, 2 or 3). A student's level is inferred from the combination of items answered correctly. When writing item bank v.1, each item carries a code such as <i>KN2.2-M2</i> (indicator – targeted level).</li>
  </ul>
  <h3>General meaning of the 4 levels (SOLO taxonomy)</h3>
  <div class="tbl"><table>
    <thead><tr><th>Level</th><th>Name</th><th>SOLO correspondence</th><th>General meaning for all indicators</th></tr></thead>
    <tbody>
      <tr><td><b>0</b></td><td>Not achieved</td><td>Pre-structural</td><td>No answer, or irrelevant or scientifically incorrect information, or merely restating the phenomenon.</td></tr>
      <tr><td><b>1</b></td><td>Partially achieved</td><td>Uni-structural / Multi-structural</td><td>One or a few correct but disconnected elements, lacking links or steps.</td></tr>
      <tr><td><b>2</b></td><td>Achieved</td><td>Relational</td><td>Correct elements connected into a coherent whole; fully meets the Grade 9 Science requirements.</td></tr>
      <tr><td><b>3</b></td><td>Exceeds</td><td>Extended abstract</td><td>As Level 2, plus generalisation to a new situation, consideration of the limits of the data or model, or consideration of an alternative explanation.</td></tr>
    </tbody></table></div>
  <p><b>Level 2 is the standard level</b> – corresponding to the curriculum requirements. Level 3 describes students exceeding the requirements; keeping Level 3 for Grade 9 students is a hypothesis, to be verified through learning progressions.</p>
</section>

<section class="sub" data-label="Framework &amp; rubric validation">
  <h3>Expert validation of the framework and rubrics themselves</h3>
  <p>The competency descriptor set and the rubrics are the <b>reference standard</b> for everything that follows: items are judged against the indicators and targeted levels, and student work is scored with the rubrics. If the standard itself is flawed — overlapping indicators, levels that do not progress, rubric levels that cannot be told apart — item validation can still look fine on a wrong foundation, and later on it becomes impossible to tell whether a problem lies in the instrument or in the raters. The framework is therefore validated <b>first, in its own separate round</b>, completed before Session 5 so the team can finalise the framework and align the item set; the item form is sent only afterwards.</p>
  <h3>Validation principles</h3>
  <ul>
    <li><b>Standard first, items second.</b> The framework must be finalised before items are validated; items are always judged against the revised framework, never against a draft.</li>
    <li><b>Independent and multi-perspective.</b> One expert panel — measurement, Biology content, practising teachers, language — validates both the framework and the items; each expert rates independently before any consensus meeting.</li>
    <li><b>Decisions at the smallest unit.</b> Each component of the framework is examined separately, so the team decides keep / revise / merge–drop for exactly that component instead of judging the framework as a whole.</li>
    <li><b>Every change must be traceable.</b> Wherever the framework changes, the related items must be reviewed and aligned; no item may remain judged against the old framework.</li>
    <li><b>Experts advise, the team decides.</b> Expert feedback is evidence for the team to weigh; the final decision, and its reasons, belong to the team.</li>
  </ul>
  <h3>Design of the validation</h3>
  <p>The validation follows the framework's own layered structure, from the general to the specific — 23 units:</p>
  <div class="tbl"><table>
    <thead><tr><th>Layer of the framework</th><th>Units</th></tr></thead>
    <tbody>
      <tr><td>Competency definition</td><td>1</td></tr>
      <tr><td>Definitions of the 3 component skills</td><td>3</td></tr>
      <tr><td>Behavioural indicators (KN1.1–KN3.4)</td><td>11</td></tr>
      <tr><td>Level-descriptor set for each skill</td><td>3</td></tr>
      <tr><td>Rubrics (generic rubric + rubrics of the 4 constructed-response items)</td><td>5</td></tr>
    </tbody></table></div>
  <p>Each unit is examined from three angles: <b>sound and complete</b> (true to its nature, full in scope), <b>clear</b> (read the same way by everyone, observable) and <b>distinct</b> (no overlap with neighbouring units) — together with a keep / revise / merge–drop recommendation and specific comments. The form ends with coverage questions about the framework as a whole: whether the 3 skills and 11 indicators fully cover the competency, and what is still missing or redundant.</p>
</section>

const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const chips = h => h.replace(/KN([123])(?:\.[\dx])?(?:–KN\d\.\d)?/g, m => `<span class="kn k${m[2]}">${m}</span>`);
const inl = s => chips(esc(s));
function block(s){
  const lines = String(s||"").split("\n").map(l=>l.trim()).filter(Boolean);
  let out="", list=null;
  const close=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  for(const l of lines){
    let m;
    if((m=l.match(/^[-–•]\s*(.*)$/))){ if(list!=="ul"){close(); out+="<ul>"; list="ul";} out+=`<li>${inl(m[1])}</li>`; }
    else if((m=l.match(/^\d+\.\s*(?:\[([^\]]+)\]\s*)?(.*)$/))){ if(list!=="ol"){close(); out+="<ol>"; list="ol";} out+=`<li>${m[1]?`<span class="qtag">${esc(m[1])}</span>`:""}${inl(m[2])}</li>`; }
    else { close(); out+=`<p>${inl(l)}</p>`; }
  }
  close(); return out;
}

async function exportQM(c,msg){
  const U=UI[LANG];
  const say=t=>{ if(msg) msg.textContent=t; };
  if(typeof XLSX==="undefined"){ say(U.xNoLib); return; }
  const rows=QROWS.filter(r=>!c||r[2]===c);
  const head=U.xHead;
  const aoa=[[U.xTitle+(c?` – ${U.xCluster} ${c}`:"")],[],head];
  rows.forEach(r=>aoa.push([r[0],r[2],r[3],lessonD(r[4]),r[5],r[6],r[7],cogD(r[8]),typeD(r[9]),r[10],"","","",""]));
  const n=rows.length, first=4, last=3+n;
  aoa.push([U.xTotal,`${n} ${U.xItems}`,"","","","","","","",null,"","","",""]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws[XLSX.utils.encode_cell({r:last,c:9})]={t:"n",f:`SUM(J${first}:J${last})`,v:rows.reduce((a,r)=>a+r[10],0)};
  ws["!cols"]=[6,6,10,11,9,9,16,12,18,7,50,30,36,7].map(w=>({wch:w}));
  ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:13}}];
  ws["!autofilter"]={ref:`A3:N${last}`};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,U.xTitle);
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const name=`Ma_tran_cau_hoi${c?"_Cum_"+c:""}.xlsx`;
  if(DL && DL!=="local"){
    try{ await DL.save({filename:name,data:buf}); say(U.xSaved); }
    catch(e){
      const code=e&&e.code;
      if(code==="declined") say(U.xDeclined);
      else if(code==="rate_limited") say(U.xRate);
      else { say(U.xFail); }
    }
  } else if(DL==="local"){
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); say(U.xSaved);
  } else { say(U.xInit); }
}

}
function renderCI(){
  const sec=main.querySelector("#ci-sec"); if(!sec) return;
  const EN=LANG==="en";
  sec.innerHTML = EN ? `
  <h3>Cognitive interviews with students (think-aloud)</h3>
  <p>Cognitive interviews provide response-process evidence &#8211; something experts cannot substitute: whether students understand each item as its indicator intends, where they get stuck, and how long they actually take. The results are used together with the item-validation results in Session 6 to finalise the revision list before the pilot.</p>
  <h3>Interview principles</h3>
  <ul>
    <li><b>No hints, no re-teaching.</b> The interviewer uses only neutral probes (&#8220;What are you thinking?&#8221;, &#8220;What does this item ask you to do?&#8221;, &#8220;Where did you get stuck?&#8221;); the student&#8217;s words are the evidence.</li>
    <li><b>Record verbatim.</b> The student&#8217;s own words are recorded exactly as spoken, never interpreted or rephrased on their behalf.</li>
    <li><b>Separate item problems from student problems.</b> Missing knowledge is a property of the student&#8217;s preparation, not a flaw of the item, and the two are kept apart when conclusions are drawn.</li>
    <li><b>Measure real time, item by item.</b> Working time is timed per item, never estimated afterwards.</li>
  </ul>
  <h3>Design of the interviews</h3>
  <p>Two student groups, serving two different checks:</p>
  <div class="tbl"><table><thead><tr><th>Group</th><th>Task</th><th>Purpose</th></tr></thead><tbody>
  <tr><td><b>Grade 10</b></td><td>Attempt each item of the assigned test while saying all their thinking aloud; the teacher times each item and records the outcome (Correct / Partial / Wrong / Blank)</td><td>Real difficulty, whether the thinking process matches the indicator, and actual working time</td></tr>
  <tr><td><b>Grade 9</b></td><td>Only read the item and restate its demand in their own words, without solving it</td><td>Whether the wording is clear to the very students who will take the test</td></tr>
  </tbody></table></div>
  <p>Purposive sampling: each test A/B/C includes students at all 3 achievement levels (by their most recent Biology marks), drawn from classes outside the Session 7 pilot sample to avoid leaking the items; each student takes only the assigned test. Consent from parents and from the student is required; audio recording only with consent.</p>
  <p>Each record covers 1 student &#215; 1 item: working time, outcome or comprehension level, problem codes &#8211; Y1 misunderstood the demand &#183; Y2 misread a figure, table or symbol &#183; Y3 difficult word &#183; Y4 too long, not enough time &#183; Y5 correct by guessing or by a hint &#183; Y6 missing knowledge (not an item flaw; for Grade 9 only Y2, Y3 and Y6 are used) &#8211; the words the student found difficult, verbatim quotes, and the teacher&#8217;s notes.</p>
  <p>Synthesis is per item and follows one logic: a problem repeated across several students means the item must be revised; a one-off problem is judged by reading the student&#8217;s verbatim words; a problem caused by missing knowledge leads to checking the item&#8217;s difficulty, not its wording. The measured working time is checked against each test&#8217;s time limit (A 25 &#8211; B 20 &#8211; C 15 minutes) to decide whether items must be dropped or materials shortened.</p>`
  : `
  <h3>Phỏng vấn nhận thức học sinh</h3>
  <p>Phỏng vấn nhận thức cho bằng chứng về quá trình trả lời của HS — điều chuyên gia không thể thay thế: HS có hiểu câu hỏi đúng ý đồ của chỉ báo hay không, vướng ở đâu, và mất bao lâu để làm. Kết quả được dùng cùng kết quả thẩm định bộ câu hỏi ở Buổi 6 để chốt danh mục sửa trước pilot.</p>
  <h3>Nguyên tắc phỏng vấn</h3>
  <ul>
    <li><b>Không gợi ý, không dạy lại.</b> Người phỏng vấn chỉ dùng câu thăm dò trung tính ("Em đang nghĩ gì?", "Câu này bảo em làm gì?", "Chỗ nào làm em dừng lại?"); lời của HS chính là bằng chứng.</li>
    <li><b>Ghi nguyên văn.</b> Lời HS được ghi đúng như em nói, không diễn giải hay viết thay ý của em.</li>
    <li><b>Phân biệt lỗi của câu với khó khăn của HS.</b> Thiếu kiến thức là vấn đề chuẩn bị của HS, không phải lỗi của câu hỏi; hai loại này phải tách bạch khi kết luận.</li>
    <li><b>Đo thời gian thật theo từng câu.</b> Thời gian làm được bấm giờ từng câu, không ước lượng sau.</li>
  </ul>
  <h3>Khung thiết kế phần phỏng vấn</h3>
  <p>Hai nhóm học sinh phục vụ hai mục đích kiểm tra khác nhau:</p>
  <div class="tbl"><table><thead><tr><th>Nhóm</th><th>Cách làm</th><th>Mục đích</th></tr></thead><tbody>
  <tr><td><b>Lớp 10</b></td><td>Làm từng câu trong bài được giao và nói to mọi suy nghĩ; GV bấm giờ từng câu, ghi kết quả Đúng / Một phần / Sai / Bỏ trống</td><td>Đo độ khó thật, quá trình tư duy có đúng chỉ báo không, và thời gian làm bài thực tế</td></tr>
  <tr><td><b>Lớp 9</b></td><td>Chỉ đọc đề và nói lại yêu cầu bằng lời của mình, không giải</td><td>Kiểm tra độ rõ của câu chữ với đúng đối tượng sẽ làm bài</td></tr>
  </tbody></table></div>
  <p>Chọn mẫu có chủ đích: mỗi bài A/B/C có HS ở cả 3 mức học lực (theo điểm Sinh học gần nhất), lấy từ các lớp không thuộc mẫu pilot ở Buổi 7 để tránh lộ đề; mỗi HS chỉ làm bài được giao. Phải có đồng thuận của phụ huynh và của HS; chỉ ghi âm khi được đồng ý.</p>
  <p>Mỗi lượt ghi chép gồm 1 HS × 1 câu: thời gian làm, kết quả/mức hiểu, mã vướng mắc — Y1 hiểu sai yêu cầu · Y2 đọc sai hình, bảng, kí hiệu · Y3 từ khó · Y4 quá dài, thiếu thời gian · Y5 đúng nhờ đoán hoặc gợi ý · Y6 thiếu kiến thức (không phải lỗi câu hỏi; với lớp 9 chỉ dùng Y2, Y3, Y6) — từ HS thấy khó, trích nguyên văn lời HS và ghi chú của GV.</p>
  <p>Tổng hợp theo từng câu theo một logic chung: vướng mắc lặp lại ở nhiều HS thì câu phải sửa; vướng mắc chỉ gặp ở một HS thì đọc trích lời của em trước khi quyết định; vướng mắc do thiếu kiến thức thì xem lại độ khó của câu, không sửa câu chữ. Thời gian làm thực tế được đối chiếu với thời lượng từng bài (A 25 – B 20 – C 15 phút) để quyết định bớt câu hay rút gọn tư liệu.</p>`;
}
function renderTMC(){
  const sec=main.querySelector("#tmc-sec"); if(!sec) return;
  const U=UI[LANG], EN=LANG==="en";
  const H=EN?TM_EN.heads:DATA.tmHeads, TASKS=EN?TM_EN.tasks:DATA.tasks;
  const COLS=[0,1,5,6,7,8,9], MW={0:180,1:200,5:220,6:170,7:190,8:180,9:130};
  const CN={}; DATA.weights.clusters.forEach((r,i)=>{ if(r[0]) CN[r[0]]=[EN?WSTR_EN.clusters[i][1]:r[1], r[4]]; });
  const headHtml=()=>COLS.map(j=>`<th style="min-width:${MW[j]}px">${j===9?U.tmcPilot:esc(H[j])}</th>`).join("");
  const rowHtml=(r,c)=>{ const code=r[0].split(" ")[0], name=r[0].slice(code.length).trim();
    const pilot=r[9].split(",").map(x=>x.trim()).filter(x=>x[0]===c).join(", ");
    return `<tr><td><span class="kn k${code[2]}">${esc(code)}</span><br><b>${esc(name)}</b></td>${COLS.slice(1).map(j=>`<td>${inl(j===9?pilot:r[j])}</td>`).join("")}</tr>`; };
  const grpHtml=c=>`<tr class="tm-grp"><td colspan="${COLS.length}"><b>${U.tmcCluster} ${c} – ${esc(CN[c][0])}</b> <span style="color:var(--muted);font-weight:500">(${U.tmcTarget} ${num(CN[c][1])} / 40)</span></td></tr>`;
  let h=`<h3>${U.tmcH}</h3><p class="note">${U.tmcNote}</p><div class="toolbar"><button type="button" data-f="" class="on">${U.tmAll}</button><button type="button" data-f="A">${U.clusFil} A</button><button type="button" data-f="B">${U.clusFil} B</button><button type="button" data-f="C">${U.clusFil} C</button></div>`;
  h+=`<div class="tm-block" data-c=""><div class="tbl"><table class="tm-tbl fix1"><thead><tr>${headHtml()}</tr></thead><tbody>
  ${["A","B","C"].map(c=>{ const rows=TASKS.filter(r=>r[2].split(",").map(x=>x.trim()).includes(c));
    return grpHtml(c) + rows.map(r=>rowHtml(r,c)).join(""); }).join("")}
  </tbody></table></div></div>`;
  for(const c of ["A","B","C"]){
    const rows=TASKS.filter(r=>r[2].split(",").map(x=>x.trim()).includes(c));

    <div class="tbl"><table class="tm-tbl fix1"><thead><tr>${headHtml()}</tr></thead><tbody>
    ${rows.map(r=>rowHtml(r,c)).join("")}
    </tbody></table></div></div>`;
  }
  sec.innerHTML=h;
  sec.querySelectorAll(".toolbar button").forEach(b=>b.addEventListener("click",()=>{
    sec.querySelectorAll(".toolbar button").forEach(x=>x.classList.toggle("on",x===b)); const f=b.dataset.f; sec.querySelectorAll(".tm-block").forEach(bl=>bl.hidden = bl.dataset.c!==f);
  }));
}
